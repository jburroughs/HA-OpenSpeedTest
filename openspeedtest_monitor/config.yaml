name: "OpenSpeedTest Monitor"
description: "Run scheduled internet speed tests against any reachable OpenSpeedTest server — whether it's running locally or as a Docker container on another machine on your network — and visualize results over time."
version: "1.9.0"
slug: "openspeedtest_monitor"
init: false
homeassistant_api: true
hassio_api: false
auth_api: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:speedometer"
panel_title: "Speed Monitor"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

options:
  openspeedtest_url: "http://192.168.1.100:3000"
  test_interval_minutes: 30
  max_results: 500
  log_level: "info"

schema:
  openspeedtest_url: str
  test_interval_minutes: int(5,1440)
  max_results: int(50,10000)
  log_level: list(debug|info|warning|error)
